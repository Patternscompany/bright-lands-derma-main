<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You | Bright Lands Derma</title>
  <meta name="description" content="Thank you for reaching out to Bright Lands Derma. We have received your inquiry." />

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="imge/favicon.png" />

  <!-- Google Web Fonts -->
  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />

  <!-- Customized Bootstrap Stylesheet -->
  <link href="css/style.css" rel="stylesheet" />

  <style>
    body {
      background-color: #f8f9fa;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      font-family: 'Poppins', sans-serif;
    }

    .thank-you-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .thank-you-card {
      background: #fff;
      padding: 50px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 600px;
      width: 100%;
    }

    .thank-you-card i {
      font-size: 80px;
      color: #BE2A4B;
      margin-bottom: 25px;
    }

    .thank-you-card h1 {
      color: #BE2A4B;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .thank-you-card p {
      font-size: 1.1rem;
      color: #555;
      margin-bottom: 30px;
    }

    .btn-primary {
      background-color: #BE2A4B;
      border-color: #BE2A4B;
      padding: 12px 30px;
      font-weight: 600;
      border-radius: 30px;
      transition: all 0.3s;
    }

    .btn-primary:hover {
      background-color: #9e223d;
      border-color: #9e223d;
      transform: translateY(-2px);
    }

    .brand-logo {
      height: 60px;
      margin-bottom: 30px;
    }
    
    footer {
        padding: 20px;
        text-align: center;
        background: #BE2A4B;
        color: white;
    }
    footer a {
        color: white;
        text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="thank-you-container">
    <div class="thank-you-card">
      <a href="index.html">
        <img src="imge/bright-lands-derma.png" alt="Bright Lands Derma" class="brand-logo">
      </a>
      <div>
        <i class="fa-solid fa-circle-check"></i>
      </div>
      <h1>Thank You!</h1>
      <p>Your inquiry has been received successfully. Our team will review your request and get back to you shortly.</p>
      <a href="index.html" class="btn btn-primary">Back to Home</a>
    </div>
  </div>

  <footer>
    &copy; 2024 Bright Lands Derma. All Rights Reserved.
  </footer>
</body>

</html>
